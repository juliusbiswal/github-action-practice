# This is the name of the workflow
name: Hello Workflow
# Runs on an automatic Trigger , whenever change is pushed to branch ( deployment )
on:
  push:
    branches: [main]
# These are jobs inside the workflows
jobs:
# Name of the job
  greet:
# This is github runner , each jobs runs on a runner
    runs-on: ubuntu-latest
    steps:
      - name: say hello to user
        run: echo "Hello Dosto"
      - name: say hello to username
        run: echo "Hello $USER"
